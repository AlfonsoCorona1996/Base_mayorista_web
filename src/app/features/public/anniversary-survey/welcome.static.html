<!-- Bienvenida estática sincronizada con anniversary-survey.html y sus estilos. -->
<style>
  #app-shell-skeleton.bm-survey-splash { display: flex; flex-direction: column; overflow-y: auto; opacity: 1; animation: none; color: #1d1d1f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; letter-spacing: normal; -webkit-text-size-adjust: 100%; }
  #app-shell-skeleton.bm-survey-splash.is-leaving { opacity: 0; transition: opacity 0.28s ease; pointer-events: none; }
  .bm-survey-splash, .bm-survey-splash * { box-sizing: border-box; }
  .bm-survey-splash svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bms-splash-logo { display: none; }
  html.bms-resume #app-shell-skeleton.bm-survey-splash { align-items: center; justify-content: center; }
  html.bms-resume .bms-splash-logo { display: block; width: 96px; height: 60px; }
  html.bms-resume .bms-welcome { display: none; }
#app-shell-skeleton.bm-survey-splash {
  padding: max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
  background:
    radial-gradient(ellipse at 0% 0%, rgba(255, 177, 29, 0.12), transparent 60%),
    radial-gradient(ellipse at 100% 100%, rgba(226, 19, 99, 0.07), transparent 60%),
    #fdfbf8;
}

.bms-welcome {
  width: 100%;
  max-width: 440px;
  margin: auto;
  padding: 24px 16px;
  border: 1px solid #ece6df;
  border-radius: 24px;
  background: #ffffff;
}

.bms-hero {
  text-align: center;
}

.bms-logo {
  display: block;
  width: 96px;
  height: auto;
  margin: 0 auto 24px;
}

.bms-title {
  margin: 0;
  font-family: inherit;
  font-size: clamp(1.75rem, 7vw, 2.25rem);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -0.025em;
  text-wrap: balance;
}


.bms-brand {
  display: block;
  color: #d50e5f;
}

.bms-lead {
  max-width: 30ch;
  margin: 12px auto 0;
  color: #55555c;
  font-size: 1rem;
  line-height: 1.5;
  text-wrap: pretty;
}

.bms-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-top: 24px;
}

.bms-gift {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-radius: 12px;
  background: #fff1f6;
}

.bms-gift-icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  color: #d50e5f;
  background: #ffffff;
}


.bms-gift-copy {
  min-width: 0;
}

.bms-gift-title {
  margin: 0 0 4px;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.bms-gift-text {
  margin: 0;
  color: #55555c;
  font-size: 0.875rem;
  line-height: 1.5;
}

.bms-meta {
  margin: 0;
  color: #55555c;
  font-size: 0.875rem;
  line-height: 1.5;
  text-align: center;
}


  .bms-cta { width: 100%; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 14px; color: #fff; background: #1d1d1f; font: inherit; font-size: 1.0625rem; font-weight: 600; line-height: 1.2; cursor: pointer; }
  @media (min-width: 768px) { .bms-welcome { padding: 32px; } #app-shell-skeleton.bm-survey-splash { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); } }
</style>
<div id="app-shell-skeleton" class="bm-survey-splash" aria-hidden="true">
<script>
    (function () {
      try {
        var draft = JSON.parse(localStorage.getItem("bm.survey.aniversario-2026") || "null");
        if (draft && (draft.step > 0 || draft.submission === "confirmed")) {
          document.documentElement.classList.add("bms-resume");
        }
      } catch (e) {}
    })();
  </script>
  <img class="bms-splash-logo" src="/aniversario/bm-icono.webp" width="96" height="60" alt="" decoding="async">
  <div class="bms-welcome">
    <div class="bms-hero">
      <img class="bms-logo" src="/aniversario/bm-logo.webp" width="136" height="118" alt="">
      <p class="bms-title" data-sync>¡Nuestro primer año <span class="bms-brand">se celebra contigo!</span></p>
      <p class="bms-lead" data-sync>Elige qué te gustaría ver en nuestro segundo año.</p>
    </div>
    <div class="bms-body">
      <div class="bms-gift">
        <span class="bms-gift-icon">
          <svg viewBox="0 0 24 24"><path d="M4 11.5h16V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM3 7.5h18v4H3zM12 7.5V21M12 7.5C10.6 4.6 7 4.2 6.6 6.1 6.3 7.4 8.6 7.5 12 7.5zm0 0c1.4-2.9 5-3.3 5.4-1.4.3 1.3-2 1.4-5.4 1.4z"/></svg>
        </span>
        <div class="bms-gift-copy">
          <p class="bms-gift-title" data-sync>10% extra</p>
          <p class="bms-gift-text" data-sync>De descuento en tu próximo pedido.</p>
        </div>
      </div>
      <p class="bms-meta" data-sync>6 preguntas · 2 minutos aprox.</p>
      <button type="button" class="bms-cta" id="bms-start" tabindex="-1">
        <span data-sync>Comenzar encuesta</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
<script>
    // Si tocan "Comenzar" antes de que cargue la app, se recuerda y la app avanza sola.
    document.getElementById("bms-start").addEventListener("click", function () {
      window.__bmSurveyStart = true;
      this.firstElementChild.textContent = "Abriendo…";
      this.setAttribute("aria-busy", "true");
    });
  </script>
</div>
