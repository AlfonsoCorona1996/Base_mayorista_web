<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Base Mayorista | Distribución al mayoreo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Base Mayorista: catálogo visual, compra organizada y atención ágil para distribución y venta al mayoreo.">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BM">
  <meta name="theme-color" content="#000000">

  <!-- Material Symbols — cargado aquí para garantizar disponibilidad en todos los componentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&amp;display=block">
  <script>
    document.documentElement.classList.add("ms-icons-loading");
    (function () {
      if (!("fonts" in document)) {
        document.documentElement.classList.remove("ms-icons-loading");
        return;
      }
      Promise.race([
        document.fonts.load('24px "Material Symbols Rounded"'),
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]).finally(() => {
        document.documentElement.classList.remove("ms-icons-loading");
      });
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para continuar usando Base Mayorista.</noscript>
</body>
</html>
