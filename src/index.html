<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Base Mayorista | Distribución al mayoreo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Base Mayorista: catálogo visual, compra organizada y atención ágil para distribución y venta al mayoreo."
  >
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Material Symbols — cargado aquí para garantizar disponibilidad en todos los componentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block"
  >
  <script>
    document.documentElement.classList.add("ms-icons-loading");
    (function () {
      if (!("fonts" in document)) {
        document.documentElement.classList.remove("ms-icons-loading");
        return;
      }
      Promise.race([
        document.fonts.load('24px "Material Symbols Rounded"'),
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]).finally(() => {
        document.documentElement.classList.remove("ms-icons-loading");
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
